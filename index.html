<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Crystal Sort: Mine Lab</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Crystal Sort: Mine Lab</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL-v786.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL-v786.data.gz",
        frameworkUrl: buildUrl + "/WebGL-v786.framework.js",
        codeUrl: buildUrl + "/WebGL-v786.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Crystal Lab Studio",
        productName: "Crystal Sort: Mine Lab",
        productVersion: "0.9.0",
        cacheControl: function(url) { return "immutable"; },
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        var viewportMeta = document.querySelector('meta[name="viewport"]');
        if (viewportMeta) viewportMeta.setAttribute('content', 'width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no');
        // Keep the Unity canvas fitted to the visual viewport on iOS Safari and
        // Telegram's in-app browser. Those browsers may retain inline stock
        // dimensions and otherwise render only the left portion of the game.
        function resizeMobileShell() {
          var viewportWidth = window.visualViewport ? window.visualViewport.width : (document.documentElement.clientWidth || window.innerWidth);
          var viewportHeight = window.visualViewport ? window.visualViewport.height : (document.documentElement.clientHeight || window.innerHeight);
          var container = document.querySelector('#unity-container');
          document.documentElement.style.setProperty('width', '100%', 'important');
          document.documentElement.style.setProperty('height', '100%', 'important');
          document.body.style.setProperty('width', '100%', 'important');
          document.body.style.setProperty('height', '100%', 'important');
          container.style.setProperty('left', '0px', 'important');
          container.style.setProperty('top', '0px', 'important');
          container.style.setProperty('transform', 'none', 'important');
          container.style.setProperty('width', viewportWidth + 'px', 'important');
          container.style.setProperty('height', viewportHeight + 'px', 'important');
          canvas.style.setProperty('width', viewportWidth + 'px', 'important');
          canvas.style.setProperty('height', viewportHeight + 'px', 'important');
          canvas.style.setProperty('max-width', 'none', 'important');
          canvas.style.setProperty('max-height', 'none', 'important');
        }
        resizeMobileShell();
        window.addEventListener('resize', resizeMobileShell);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeMobileShell);
        if (window.ResizeObserver) {
          var shellObserver = new ResizeObserver(resizeMobileShell);
          shellObserver.observe(document.documentElement);
          shellObserver.observe(document.body);
          shellObserver.observe(document.querySelector('#unity-container'));
          shellObserver.observe(canvas);
        }
        if (window.MutationObserver) {
          new MutationObserver(resizeMobileShell).observe(document.querySelector('#unity-container'), { attributes: true, attributeFilter: ['style', 'class'] });
          new MutationObserver(resizeMobileShell).observe(canvas, { attributes: true, attributeFilter: ['style', 'class', 'width', 'height'] });
        }
        // Unity may reapply its template dimensions during and immediately after
        // createUnityInstance; repeat the correction across that handoff window.
        [0, 100, 250, 500, 1000, 1500, 2000, 3000, 4000, 5000].forEach(function(delay) { setTimeout(resizeMobileShell, delay); });


        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                document.querySelector("#unity-loading-bar").style.display = "none";
                var warning = document.querySelector("#unity-warning");
                warning.innerHTML = "<div style='font:600 15px Arial;line-height:1.4;color:#061522;margin-bottom:12px'>Не удалось загрузить игру.<br><small style='font-weight:400'>Проверьте соединение и повторите попытку.</small></div>";
                var retry = document.createElement("button");
                retry.textContent = "Повторить загрузку";
                retry.style = "display:block;margin:0 auto;padding:10px 18px;border:0;border-radius:8px;background:#1e6ee8;color:white;font:600 15px Arial;cursor:pointer";
                retry.onclick = function() { window.location.reload(); };
                warning.appendChild(retry);
                warning.style.display = "block";
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
